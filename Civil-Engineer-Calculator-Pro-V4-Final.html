<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6f7fa"><meta name="description" content="Civil Engineer Calculator Pro"><title>Civil Engineer Calculator Pro V4</title><style>
:root{--bg:#f6f7fa;--card:#fff;--text:#17191d;--muted:#707680;--line:#e3e6eb;--blue:#2161ff;--blue2:#eaf0ff;--shadow:0 14px 40px rgba(20,30,50,.08)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit}button{cursor:pointer;border:0;background:none;color:inherit}
.top{height:68px;position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:0 max(16px,calc((100vw - 1180px)/2));background:rgba(255,255,255,.9);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;text-align:left}.logo{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:#17191d;color:#fff;font-size:11px;font-weight:900}.brand b,.brand small{display:block}.brand b{font-size:15px}.brand small{font-size:11px;color:var(--muted)}
.actions{display:flex;gap:5px}.actions button{padding:8px 10px;border-radius:11px;color:var(--muted);font-size:18px}.actions button:hover{background:#f0f2f5;color:var(--text)}
.wrap{max-width:1180px;margin:auto}.hero{padding:60px 18px 30px;display:flex;align-items:flex-end;justify-content:space-between}.eyebrow{font-size:10px;font-weight:900;letter-spacing:.15em;color:var(--blue)}h1{font-size:clamp(42px,6vw,66px);line-height:.98;letter-spacing:-.055em;margin:9px 0 14px}h1 em{font-style:normal;color:var(--blue)}.hero p{max-width:600px;color:var(--muted);margin:0}.stat{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:15px 19px;box-shadow:var(--shadow)}.stat b{display:block;font-size:28px}.stat small{color:var(--muted)}
.search-zone{position:relative;z-index:20;margin:0 18px}.search{height:62px;max-width:900px;margin:auto;display:flex;align-items:center;padding:0 17px;border:1px solid var(--line);background:var(--card);border-radius:18px;box-shadow:var(--shadow);transition:.2s}.search:focus-within{border-color:var(--blue);box-shadow:0 0 0 4px var(--blue2),var(--shadow)}.search>span{font-size:26px;color:var(--muted);margin-right:10px}.search input{min-width:0;flex:1;border:0;outline:0;background:transparent;color:var(--text);font-size:16px}.search .clear{font-size:25px;color:var(--muted)}
.search-panel{max-width:900px;margin:8px auto 0;background:var(--card);border:1px solid var(--line);border-radius:17px;overflow:hidden;box-shadow:var(--shadow)}.search-head{padding:10px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;font-size:12px}.search-head button{color:var(--blue);font-weight:800}.result{width:100%;display:flex;align-items:center;gap:12px;padding:12px 14px;text-align:left;border-bottom:1px solid var(--line)}.result:hover{background:#f3f5f8}.result-icon{width:38px;height:38px;border-radius:11px;background:var(--blue2);display:grid;place-items:center;font-size:19px;flex:none}.result b,.result small{display:block}.result small{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.result i{margin-left:auto;color:var(--muted);font-style:normal}.search-help{padding:15px;display:flex;gap:12px;align-items:center}.search-help>span{font-size:25px;color:var(--blue)}.search-help b,.search-help small{display:block}.search-help small{color:var(--muted);font-size:11px}
.section{padding:29px 18px}.section-head{display:flex;justify-content:space-between;align-items:end;margin-bottom:13px}.section h2{font-size:21px;margin:4px 0 0;letter-spacing:-.025em}.count{font-size:12px;color:var(--muted)}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:11px}.quick button{padding:15px;background:var(--card);border:1px solid var(--line);border-radius:16px;text-align:left;transition:.18s}.quick button:hover{transform:translateY(-2px);box-shadow:var(--shadow)}.quick span{display:block;font-size:23px;margin-bottom:7px}.quick b{font-size:13px}
.cats{display:flex;gap:8px;overflow:auto;padding-bottom:4px}.cat{white-space:nowrap;padding:9px 13px;border:1px solid var(--line);border-radius:999px;background:var(--card);font-size:12px}.cat.on{background:var(--text);color:#fff;border-color:var(--text)}.cat small{opacity:.65;margin-left:3px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}.tool{position:relative;display:flex;align-items:center;gap:12px;min-height:105px;padding:15px;background:var(--card);border:1px solid var(--line);border-radius:17px;text-align:left;transition:.18s}.tool:hover,.tool:focus-visible{transform:translateY(-2px);box-shadow:var(--shadow);border-color:#cbd4e7;outline:0}.icon{width:44px;height:44px;flex:none;border-radius:13px;background:var(--blue2);display:grid;place-items:center;font-size:22px}.copy{min-width:0}.copy .tag{display:block;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--blue);font-weight:900}.copy b{display:block;font-size:14px}.copy p{margin:2px 0 0;color:var(--muted);font-size:11px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.fav{position:absolute;right:7px;top:6px;padding:4px;font-size:18px;color:#a5aab3}.fav.on{color:#f2a300}.arrow{margin-left:auto;color:#a5aab3;font-size:18px}.empty{grid-column:1/-1;text-align:center;background:var(--card);border:1px dashed var(--line);border-radius:17px;padding:38px}.empty b,.empty small{display:block}.empty small{color:var(--muted);font-size:12px}
.bottom{display:none}
.dark{--bg:#101216;--card:#17191e;--text:#f4f5f7;--muted:#a6abb4;--line:#2b2f38;--blue2:#172b60}.dark .top{background:rgba(16,18,22,.9)}
@media(max-width:800px){.hero{padding-top:42px}.stat{display:none}.grid{grid-template-columns:repeat(2,1fr)}.bottom{position:fixed;display:flex;z-index:60;bottom:0;left:0;right:0;height:62px;padding-bottom:env(safe-area-inset-bottom);background:rgba(255,255,255,.94);backdrop-filter:blur(16px);border-top:1px solid var(--line)}.dark .bottom{background:rgba(16,18,22,.94)}.bottom button{flex:1;color:var(--muted);font-size:19px}.bottom small{display:block;font-size:10px}.bottom .active{color:var(--blue)}body{padding-bottom:64px}}
@media(max-width:520px){.hero{padding:34px 15px 23px}.section{padding:23px 15px}.search-zone{margin:0 15px}.search{height:56px}.grid{grid-template-columns:1fr}.quick{grid-template-columns:repeat(2,1fr)}h1{font-size:43px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style></head><body><div id="app"></div><script>
'use strict';
const $=id=>document.getElementById(id);
const q=(s,p=document)=>p.querySelector(s);
const qa=(s,p=document)=>[...p.querySelectorAll(s)];
const fmt=(n,d=2)=>Number.isFinite(Number(n))?Number(n).toLocaleString('en-IN',{minimumFractionDigits:d,maximumFractionDigits:d}):'—';
const num=id=>{const e=$(id);if(!e)return NaN;const n=Number.parseFloat(e.value);return Number.isFinite(n)?n:NaN};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const KEY='ce_v3_';
let currentTool=null, currentCategory='all', convType='length', bbs=[], estRows=[], toastTimer=null;

function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),1800)}
function storageGet(key,fallback){try{return JSON.parse(localStorage.getItem(KEY+key))??fallback}catch{return fallback}}
function storageSet(key,value){try{localStorage.setItem(KEY+key,JSON.stringify(value));return true}catch{return false}}
function positive(v){return Number.isFinite(v)&&v>0}
function nonNegative(v){return Number.isFinite(v)&&v>=0}
function setVal(id,n,unit=''){const e=$(id);if(e)e.textContent=Number.isFinite(Number(n))?fmt(n,2)+(unit?' '+unit:''):'—'}
function rows(arr){return arr.map(x=>`<div class="detail-row"><span>${esc(x[0])}</span><span>${esc(x[1])}</span></div>`).join('')}
function field(id,label,unit='',type='number',value='',on='',opts={}){
 const required=opts.required!==false, min=opts.min??'';
 return `<div class="form-group" id="fg_${id}"><label for="${id}">${esc(label)}${required?' *':''}</label><div class="input"><input id="${id}" type="${type}" value="${esc(value)}" step="any" ${min!==''?`min="${min}"`:''} ${on?`oninput="${on}"`:''} autocomplete="off">${unit?`<span class="unit">${esc(unit)}</span>`:''}</div><div class="error-msg" id="err_${id}"></div></div>`
}
function selectField(id,label,opts,value,on=''){
 return `<div class="form-group"><label for="${id}">${esc(label)}</label><div class="input"><select id="${id}" ${on?`onchange="${on}"`:''}>${opts.map(o=>{const p=o.includes('|')?o.split('|'): [o,o];return `<option value="${esc(p[0])}" ${p[0]===value?'selected':''}>${esc(p[1])}</option>`}).join('')}</select></div></div>`
}
function res(id,label,cls='',unit=''){return `<div class="result ${cls}"><button class="result-copy" onclick="copyResult('${id}')" title="Copy">⧉</button><b id="${id}">—</b><span>${esc(label)}${unit?' ('+esc(unit)+')':''}</span></div>`}
function clearFields(...ids){ids.forEach(id=>{const e=$(id);if(e)e.value='';});ids.forEach(id=>{const e=$('err_'+id);if(e)e.textContent='';const f=$('fg_'+id);if(f)f.classList.remove('invalid')})}
function validate(ids){
 let ok=true;
 ids.forEach(id=>{const e=$(id);if(!e)return;const v=num(id);const f=$('fg_'+id),er=$('err_'+id);if(!positive(v)){ok=false;f?.classList.add('invalid');if(er)er.textContent='Enter a value greater than 0.'}else{f?.classList.remove('invalid');if(er)er.textContent=''}});
 return ok
}
function copyText(text){const fallback=()=>{const t=document.createElement('textarea');t.value=text;document.body.appendChild(t);t.select();try{document.execCommand('copy');toast('Copied')}finally{t.remove()}};if(navigator.clipboard?.writeText)navigator.clipboard.writeText(text).then(()=>toast('Copied')).catch(fallback);else fallback()}
function copyResult(id){const e=$(id);if(e)copyText(e.textContent)}
function actionBar(text){return `<div class="actions"><button class="btn success" onclick='copyText(${JSON.stringify(text)})'>Copy result</button><button class="btn primary" onclick='saveCalc(${JSON.stringify(text.split("\\n")[0])},${JSON.stringify(text)})'>Save</button><button class="btn" onclick="window.print()">Print / PDF</button></div>`}
function saveCalc(tag,text){
 const a=storageGet('history',[]);a.unshift({id:Date.now(),tag,text,tool:currentTool});storageSet('history',a.slice(0,200));updateHistory();toast('Saved to history')
}
function updateHistory(){const a=storageGet('history',[]);$('historyCount').textContent=a.length}
function openHistory(){renderHistory();$('drawer').classList.add('show');$('drawerOverlay').classList.add('show')}
function closeHistory(){$('drawer').classList.remove('show');$('drawerOverlay').classList.remove('show')}
function renderHistory(){
 const term=($('historySearch')?.value||'').toLowerCase().trim(),a=storageGet('history',[]).filter(x=>(x.tag+' '+x.text).toLowerCase().includes(term));
 $('historyBody').innerHTML=a.length?a.map((x,i)=>`<div class="history-item"><b>${esc(x.tag)}</b><small>${new Date(x.id).toLocaleString('en-IN')}</small><pre>${esc(x.text)}</pre><div class="history-actions"><button class="btn" onclick="copyText(${JSON.stringify(x.text)})">Copy</button><button class="btn danger" onclick="deleteHistory(${x.id})">Delete</button></div></div>`).join(''):'<div class="empty">No saved calculations found.</div>'
}
function deleteHistory(id){storageSet('history',storageGet('history',[]).filter(x=>x.id!==id));updateHistory();renderHistory();toast('Deleted')}
function clearHistory(){if(!storageGet('history',[]).length)return;storageSet('history',[]);updateHistory();renderHistory();toast('History cleared')}
function exportHistory(){const a=storageGet('history',[]);if(!a.length)return toast('Nothing to export');downloadText('civil-engineer-history.txt',a.map(x=>`${x.tag}\n${new Date(x.id).toLocaleString('en-IN')}\n${x.text}\n\n`).join(''))}
function downloadText(name,text){const blob=new Blob([text],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),500)}
function toggleTheme(){const dark=document.documentElement.dataset.theme==='dark';document.documentElement.dataset.theme=dark?'':'dark';localStorage.setItem(KEY+'theme',dark?'light':'dark');$('themeBtn').textContent=dark?'☾':'☀'}
function favorite(id){
 let a=storageGet('favorites',[]);a=a.includes(id)?a.filter(x=>x!==id):[...a,id];storageSet('favorites',a);renderHome();updateWorkspaceFavorite();toast(a.includes(id)?'Added to favorites':'Removed from favorites')
}
function isFav(id){return storageGet('favorites',[]).includes(id)}
function updateFavCount(){$('favCount').textContent=storageGet('favorites',[]).length}
function toolButton(t){return `<div class="tool" role="button" tabindex="0" onclick="openTool('${t.id}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openTool('${t.id}')}"><button class="fav ${isFav(t.id)?'on':''}" onclick="event.stopPropagation();favorite('${t.id}')" aria-label="Favorite">${isFav(t.id)?'★':'☆'}</button><div class="tool-icon">${t.icon}</div><div><b>${esc(t.name)}</b><p>${esc(t.desc)}</p></div></div>`}
function renderToolGrid(list,target='toolGrid'){const el=$(target);if(el)el.innerHTML=list.map(toolButton).join('')}
function renderHome(){
 const s=($('searchInput').value||'').toLowerCase().trim();
 let list=tools.filter(t=>(currentCategory==='all'||t.cat===currentCategory)&&(!s||(t.name+' '+t.desc+' '+t.cat+' '+t.tags.join(' ')).toLowerCase().includes(s)));
 $('emptySearch').classList.toggle('hidden',!!list.length);renderToolGrid(list);
 qa('.cat').forEach(x=>x.classList.toggle('active',x.dataset.cat===currentCategory));
 const fav=tools.filter(t=>isFav(t.id));$('favoriteSection').classList.toggle('hidden',!fav.length);if(fav.length)renderToolGrid(fav,'favoriteGrid');
 updateFavCount();$('toolCount').textContent=tools.length;
 const recent=storageGet('recent',[]).slice(0,6);$('recentSection').classList.toggle('hidden',!recent.length);
 $('recentGrid').innerHTML=recent.map(r=>`<button class="recent" onclick="openTool('${esc(r.id)}')"><b>${esc(r.name)}</b><small>${new Date(r.at).toLocaleString('en-IN')}</small></button>`).join('');
}
function updateWorkspaceFavorite(){if(currentTool)$('wsFav').textContent=isFav(currentTool)?'★':'☆'}
function openTool(id){
 const t=tools.find(x=>x.id===id);if(!t||!shells[id])return;
 currentTool=id;$('home').style.display='none';$('workspace').classList.add('active');$('wsTitle').textContent=t.name;$('wsDesc').textContent=t.desc;$('toolContent').innerHTML=shells[id].html();updateWorkspaceFavorite();
 let recent=storageGet('recent',[]).filter(x=>x.id!==id);recent.unshift({id,name:t.name,at:Date.now()});storageSet('recent',recent.slice(0,8));renderHome();
 initTool(id);window.scrollTo({top:0,behavior:'smooth'})
}
function closeTool(){currentTool=null;$('workspace').classList.remove('active');$('home').style.display='block';renderHome();window.scrollTo({top:0,behavior:'smooth'});}
function goHome(){if($('workspace').classList.contains('active'))closeTool();setNav('navHome')}
function showFavorites(){if($('workspace').classList.contains('active'))closeTool();const fav=tools.filter(t=>isFav(t.id));currentCategory='all';$('searchInput').value='';renderHome();$('favoriteSection').classList.remove('hidden');if(!fav.length)toast('No favorites yet');setNav('navFav');setTimeout(()=>$('favoriteSection').scrollIntoView({behavior:'smooth'}),50)}
function focusSearch(){if($('workspace').classList.contains('active'))closeTool();setNav('navHome');setTimeout(()=>{$('searchInput').focus();window.scrollTo({top:0,behavior:'smooth'})},50)}
function setNav(id){qa('.nav-btn').forEach(x=>x.classList.remove('active'));$(id)?.classList.add('active')}
$('wsFav').onclick=()=>currentTool&&favorite(currentTool);
$('themeBtn').onclick=toggleTheme;
$('searchInput').addEventListener('input',()=>{currentCategory='all';renderHome()});
$('categoryBar').addEventListener('click',e=>{const b=e.target.closest('.cat');if(!b)return;currentCategory=b.dataset.cat;renderHome()});
$('historySearch').addEventListener('input',renderHistory);

const tools=[
{id:'angle',cat:'tools',icon:'📐',name:'Right Triangle',desc:'Hypotenuse, area, perimeter and angles',tags:['triangle','pythagoras','slope']},
{id:'mix',cat:'rcc',icon:'🧱',name:'Concrete Mix',desc:'Nominal mix quantity estimator',tags:['cement','sand','aggregate','m20']},
{id:'volume',cat:'site',icon:'◼️',name:'Volume & Weight',desc:'Volume, density, weight and area',tags:['volume','density','rcc']},
{id:'converter',cat:'tools',icon:'⇄',name:'Engineering Converter',desc:'Length, area, volume, pressure and more',tags:['unit','convert','mpa','kn']},
{id:'steel',cat:'steel',icon:'🔩',name:'Bar Weight',desc:'TMT/rebar weight by diameter and length',tags:['rebar','tmt','weight']},
{id:'bbs',cat:'steel',icon:'📋',name:'BBS Generator',desc:'Bar schedule, cutting length and weight',tags:['bar bending schedule','bbs','cutting']},
{id:'cutting',cat:'steel',icon:'✂️',name:'Stirrup Cutting',desc:'Rectangular beam/column tie estimate',tags:['stirrup','tie','cutting length']},
{id:'slab',cat:'rcc',icon:'▤',name:'RCC Slab',desc:'Concrete, formwork, bars and steel',tags:['slab','concrete','reinforcement']},
{id:'beam',cat:'rcc',icon:'▬',name:'RCC Beam',desc:'Concrete, main bars and stirrups',tags:['beam','rcc','steel']},
{id:'column',cat:'rcc',icon:'▥',name:'RCC Column',desc:'Concrete, vertical bars and ties',tags:['column','rcc','ties']},
{id:'footing',cat:'rcc',icon:'⬟',name:'Footing',desc:'Concrete, excavation and reinforcement',tags:['footing','foundation','excavation']},
{id:'brick',cat:'masonry',icon:'🧱',name:'Brickwork',desc:'Bricks, mortar, cement and sand',tags:['brick','masonry','wall']},
{id:'plaster',cat:'masonry',icon:'▰',name:'Plaster',desc:'Cement and sand by area and thickness',tags:['plaster','mortar']},
{id:'paint',cat:'finishing',icon:'🎨',name:'Paint & Putty',desc:'Paint, primer and putty quantity',tags:['paint','primer','putty']},
{id:'area',cat:'site',icon:'📏',name:'Area & Slope',desc:'Slope, gradient, angle and rise/run',tags:['slope','gradient','area']},
{id:'estimator',cat:'estimate',icon:'₹',name:'BOQ Cost Estimator',desc:'Material + labour + wastage estimate',tags:['boq','cost','rate','estimate','gst']},
{id:'water',cat:'rcc',icon:'💧',name:'Water / W-C Ratio',desc:'Quick water requirement from cement and W/C ratio',tags:['water','w/c','concrete']},
{id:'lap',cat:'steel',icon:'↔',name:'Lap & Development',desc:'Reference calculation using entered multiples',tags:['lap','ld','development length']},
{id:'stair',cat:'rcc',icon:'🪜',name:'Staircase',desc:'Rise, tread, slope and waist volume',tags:['stair','steps','riser','tread']},
{id:'opening',cat:'masonry',icon:'🚪',name:'Wall Openings',desc:'Deduct doors and windows from wall area',tags:['door','window','opening','wall']}
];

const shells={

function initTool(id){
 if(id==='converter')setConv('length',q('#convTabs .subtab'));
 if(id==='bbs'){bbs=[];renderBBS()}
 if(id==='estimator'){estRows=[];addEstimate()}
 const f={angle:calcAngle,mix:calcMix,volume:calcVolume,steel:calcSteel,slab:calcSlab,beam:calcBeam,column:calcColumn,footing:calcFooting,brick:calcBrick,plaster:calcPlaster,paint:calcPaint,area:calcArea,water:calcWater,lap:calcLap,stair:calcStair,opening:calcOpening,cutting:calcTie};
 if(f[id])f[id]()
}
function calcAngle(){
 const a=num('a'),b=num('b'),c=num('c');let hyp=null,A=null,B=null,area=null,per=null;
 if(a>0&&b>0){hyp=Math.hypot(a,b);area=a*b/2;per=a+b+hyp;A=Math.atan2(a,b)*180/Math.PI;B=90-A}
 if(a>0&&c>0&&!b&&c>a){const bb=Math.sqrt(c*c-a*a);hyp=c;area=a*bb/2;per=a+bb+c;A=Math.asin(a/c)*180/Math.PI;B=90-A}
 if(b>0&&c>0&&!a&&c>b){const aa=Math.sqrt(c*c-b*b);hyp=c;area=aa*b/2;per=aa+b+c;B=Math.asin(b/c)*180/Math.PI;A=90-B}
 if(a>0&&b>0&&c>0){const err=Math.abs(a*a+b*b-c*c);$('angVerify').textContent=err<0.0001?'✓ Valid right triangle.':'⚠ A² + B² does not equal C². Check the values.'}
 else $('angVerify').textContent='Enter any two sides to calculate the third.';
 setVal('angHyp',hyp,'m');setVal('angArea',area,'m²');setVal('angPer',per,'m');setVal('angA',A,'°');setVal('angB',B,'°');
 if(hyp)$('angleActions').innerHTML=actionBar(`Right Triangle\nHypotenuse: ${fmt(hyp)} m\nArea: ${fmt(area)} m²\nPerimeter: ${fmt(per)} m\nAngle A: ${fmt(A)}°\nAngle B: ${fmt(B)}°`)
}
function calcMix(){
 const v=num('mixVol'),dry=num('mixDry')||1.54,bag=num('mixBag')||50,w=num('mixWaste')||0;if(!positive(v))return;
 const valg=$('mixGrade').value;let r=valg==='custom'?[num('mixR1'),num('mixR2'),num('mixR3')]:valg.split(',').map(Number);
 $('mixCustom').classList.toggle('hidden',valg!=='custom');if(r.some(x=>!positive(x)))return;
 const dv=v*dry*(1+w/100),sum=r.reduce((a,b)=>a+b,0),cv=dv*r[0]/sum,sv=dv*r[1]/sum,av=dv*r[2]/sum,ck=cv*(num('mixCementD')||1440),sk=sv*(num('mixSandD')||1600),ak=av*(num('mixAggD')||1500);
 setVal('mixCement',Math.ceil(ck/bag),'bags');setVal('mixSand',sv,'m³');setVal('mixAgg',av,'m³');setVal('mixCementKg',ck,'kg');$('mixDetail').innerHTML=rows([['Dry volume',fmt(dv,3)+' m³'],['Cement',fmt(ck,1)+' kg / '+Math.ceil(ck/bag)+' bags'],['Sand',fmt(sk,1)+' kg'],['Aggregate',fmt(ak,1)+' kg']]);$('mixActions').innerHTML=actionBar(`Concrete Mix\nRatio: ${r.join(' : ')}\nCement: ${Math.ceil(ck/bag)} bags (${fmt(ck,1)} kg)\nSand: ${fmt(sv,3)} m³\nAggregate: ${fmt(av,3)} m³`)
}
function calcVolume(){
 const units={m:1,cm:.01,mm:.001,ft:.3048,in:.0254},l=num('vl'),b=num('vb'),h=num('vh');if(!(l>0&&b>0&&h>0))return;
 const v=l*units[$('vlu').value]*b*units[$('vbu').value]*h*units[$('vhu').value],d=$('density').value==='custom'?num('customDensity'):parseFloat($('density').value);if(!(d>0))return;const wt=v*d;
 setVal('vM3',v,'m³');setVal('vFt',v*35.3146667,'ft³');setVal('vWt',wt,'kg');setVal('vTon',wt/1000,'ton');$('vArea').textContent=fmt(l*units[$('vlu').value]*b*units[$('vbu').value],3)+' m²';$('vL').textContent=fmt(v*1000,2)+' L';$('vYd').textContent=fmt(v*1.30795,3)+' yd³';$('volumeActions').innerHTML=actionBar(`Volume & Weight\nVolume: ${fmt(v,3)} m³ (${fmt(v*35.3147,2)} ft³)\nWeight: ${fmt(wt,1)} kg (${fmt(wt/1000,3)} ton)`)
}

area:{'m²':1,'cm²':1e-4,'mm²':1e-6,'ft²':.09290304,'in²':.00064516,'yd²':.83612736,acre:4046.856422},
volume:{'m³':1,L:.001,'cm³':1e-6,'ft³':.0283168466,'in³':.000016387064,'yd³':.764554858},
weight:{kg:1,g:.001,ton:1000,lb:.45359237,oz:.0283495231},

function setCat(c){state.cat=c;render()}
function home(){state={q:"",cat:"all",mode:"home",active:null};render();scrollTo(0,0)}
function browseTools(){state.q="";state.cat="all";render();setTimeout(()=>document.querySelector(".section:last-of-type")?.scrollIntoView({behavior:"smooth"}),20)}
function openTool(id){state.mode="calc";state.active=id;V4.addRecent(id);render()}
function favorites(){let ids=V4.fav();state={q:"",cat:"all",mode:"home",active:null};render();let g=document.querySelector(".grid");if(g){g.innerHTML=ids.map(id=>V4.tool(id)).filter(Boolean).map(toolCard).join("")||`<div class="empty"><b>No saved calculators</b><small>Tap ☆ on any calculator to save it.</small></div>`;g.scrollIntoView({behavior:"smooth"})}}
function historyView(){let ids=V4.recent();state={q:"",cat:"all",mode:"home",active:null};render();let g=document.querySelector(".grid");if(g){g.innerHTML=ids.map(id=>V4.tool(id)).filter(Boolean).map(toolCard).join("")||`<div class="empty"><b>No recent calculators</b><small>Open a calculator and it will appear here.</small></div>`;g.scrollIntoView({behavior:"smooth"})}}
function renderCalc(){let t=V4.tool(state.active);document.getElementById("app").innerHTML=`<header class="top"><button class="brand" onclick="home()">← <span><b>Back</b><small>All calculators</small></span></button><div class="brand"><span>${t?.icon||"📐"}</span><b>${V4.esc(t?.name||"Calculator")}</b></div><button class="fav ${V4.isFav(state.active)?"on":""}" onclick="V4.toggle('${V4.esc(state.active)}')">${V4.isFav(state.active)?"★":"☆"}</button></header><main class="wrap" style="padding:24px 18px"><div id="calculator"></div></main>`;let box=document.getElementById("calculator");if(typeof buildCalculator==="function")buildCalculator(t,box);else if(typeof renderTool==="function")renderTool(t.id);else if(typeof openCalculator==="function")openCalculator(t.id);else box.innerHTML=`<div class="empty"><b>${V4.esc(t?.name)}</b><small>Existing calculator engine loaded, but its legacy UI entry point is unavailable.</small></div>`}
function toggleTheme(){document.documentElement.classList.toggle("dark");try{localStorage.setItem("ce-theme",document.documentElement.classList.contains("dark")?"dark":"light")}catch{}}
document.addEventListener("keydown",e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="k"){e.preventDefault();focusSearch()}if(e.key==="Escape"&&state.q)clearSearch()});
if(localStorage.getItem("ce-theme")==="dark")document.documentElement.classList.add("dark");
render();
</script></body></html>
